apis:
  - id: api:rest-v1
    name: REST API v1
    aliases: [REST API v1, API v1, v1 API, REST v1, v1 endpoints, "/v1", API keys, API key, X-Api-Key, v1 keys, v1 key]
    auth: API key in the X-Api-Key header
    status: deprecated
  - id: api:rest-v2
    name: REST API v2
    aliases: [REST API v2, API v2, v2 API, REST v2, "/v2", OAuth, OAuth 2.0, client credentials]
    auth: OAuth 2.0 client credentials
    status: ga
  - id: api:webhooks
    name: Webhooks API
    aliases: [Webhooks API, webhooks, webhook events, webhook deliveries]
    status: ga

# owner = person who owns the service day to day. owner_until marks an owner who left
# without a replacement being assigned.
services:
  - id: svc:public-api-gateway
    name: public-api-gateway
    aliases: [public-api-gateway, api gateway, API gateway, gateway]
    team: team:platform
    owner: person:jonas
    tier: 1
    description: Edge gateway that routes REST API v1 and v2 traffic.
    depends_on: [svc:auth-service, svc:payments-core, svc:invoicing-service]
    exposes: [api:rest-v1, api:rest-v2]
  - id: svc:auth-service
    name: auth-service
    aliases: [auth-service, auth service, key validator, API key validator, token endpoint]
    team: team:platform
    owner: person:dana
    owner_until: "2026-08-28"
    tier: 1
    description: Validates v1 API keys and issues OAuth tokens for v2.
    depends_on: [svc:event-bus]
    authenticates: [api:rest-v1, api:rest-v2]
  - id: svc:webhook-dispatcher
    name: webhook-dispatcher
    aliases: [webhook-dispatcher, webhook dispatcher, dispatcher, webhook queue]
    team: team:platform
    owner: person:marco
    tier: 1
    description: Delivers webhook events to customer endpoints from a durable queue.
    depends_on: [svc:event-bus]
    exposes: [api:webhooks]
  - id: svc:event-bus
    name: event-bus
    aliases: [event-bus, event bus]
    team: team:platform
    owner: person:mei
    tier: 1
    description: Internal event streaming backbone.
  - id: svc:notification-service
    name: notification-service
    aliases: [notification-service, notification service, notifications service]
    team: team:platform
    owner: person:arjun
    tier: 2
    description: Sends email and in-app notifications.
    depends_on: [svc:event-bus]
  - id: svc:payments-core
    name: payments-core
    aliases: [payments-core, payments core]
    team: team:payments
    owner: person:priya
    tier: 1
    description: Captures, refunds and settles payments.
    depends_on: [svc:ledger-service, svc:event-bus]
  - id: svc:ledger-service
    name: ledger-service
    aliases: [ledger-service, ledger service, the ledger, ledger]
    team: team:payments
    owner: person:dana
    owner_until: "2026-08-28"
    tier: 1
    description: Double-entry ledger of every balance movement, reconciled nightly.
    depends_on: [svc:event-bus]
  - id: svc:payouts
    name: payouts
    aliases: [payouts service, payouts]
    team: team:payments
    owner: person:liam
    tier: 1
    description: Schedules and executes payouts to merchants.
    depends_on: [svc:ledger-service, svc:payments-core]
  - id: svc:invoicing-service
    name: invoicing-service
    aliases: [invoicing-service, invoicing service, invoicing]
    team: team:payments
    owner: person:sofia
    tier: 1
    description: Generates invoices and line items.
    depends_on: [svc:ledger-service, svc:event-bus, svc:usage-metering]
  - id: svc:usage-metering
    name: usage-metering
    aliases: [usage-metering, usage metering, metering]
    team: team:data
    owner: person:rafael
    tier: 2
    description: Aggregates billable usage events per customer.
    depends_on: [svc:event-bus]
  - id: svc:analytics-pipeline
    name: analytics-pipeline
    aliases: [analytics-pipeline, analytics pipeline, warehouse]
    team: team:data
    owner: person:yuki
    tier: 3
    description: Batch pipeline feeding the analytics warehouse.
    depends_on: [svc:event-bus]
  - id: svc:billing-portal
    name: billing-portal
    aliases: [billing-portal, billing portal]
    team: team:growth
    owner: person:omar
    tier: 2
    description: Customer-facing web app for invoices and plans.
    depends_on: [svc:public-api-gateway]
    calls: [api:rest-v2]
  - id: svc:onboarding-flow
    name: onboarding-flow
    aliases: [onboarding-flow, onboarding flow, self-serve onboarding]
    team: team:growth
    owner: person:zoe
    tier: 2
    description: Self-serve signup that provisions new accounts and credentials.
    depends_on: [svc:auth-service]
    calls: [api:rest-v1]
  - id: svc:python-sdk
    name: python-sdk
    aliases: [python-sdk, Python SDK, tallybird-python]
    team: team:devrel
    owner: person:kenji
    tier: 2
    description: Official Python client library.
    calls: [api:rest-v1, api:rest-v2]
  - id: svc:node-sdk
    name: node-sdk
    aliases: [node-sdk, Node SDK, tallybird-node]
    team: team:devrel
    owner: person:elena
    tier: 3
    description: Official Node.js client library.
    calls: [api:rest-v2]

