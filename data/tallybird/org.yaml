incidents:
  - id: inc:INC-118
    key: INC-118
    title: Ledger reconciliation drift of 0.4%
    date: "2026-03-14"
    severity: sev2
    affected: [svc:ledger-service]
    resolved_by: person:dana
    summary: Nightly reconciliation flagged a 0.4% drift after late usage events were double-posted. Dana replayed the day and added a drift alert.
  - id: inc:INC-142
    key: INC-142
    title: Duplicate webhook deliveries caused double invoices
    date: "2026-06-09"
    severity: sev1
    affected: [svc:webhook-dispatcher, svc:invoicing-service]
    customers: [cust:tidewater, cust:granite]
    resolved_by: person:marco
    summary: Synchronous retries after receiver timeouts delivered invoice.created twice; Tidewater Freight and Granite Labs booked every invoice twice for six hours.
  - id: inc:INC-151
    key: INC-151
    title: OAuth token endpoint latency spike
    date: "2026-08-04"
    severity: sev3
    affected: [svc:auth-service]
    resolved_by: person:marco
    summary: Token issuance p99 rose to 4s after a cache eviction storm; fixed by warming the signing-key cache.
