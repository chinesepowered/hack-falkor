  # ---------------------------------------------------------------- #ubb-pilot: the cross-team squad
  - {id: msg:ubb-001, channel: chan:ubb-pilot, author: person:chloe, ts: "2026-07-23T09:00:00Z", text: "Welcome to #ubb-pilot! The usage-based billing one-pager is up. Weekly sync on Wednesdays."}
  - {id: msg:ubb-002, channel: chan:ubb-pilot, author: person:rafael, ts: "2026-07-29T10:00:00Z", text: "usage.recorded is flowing into usage-metering on staging. Sofia, what grain do you need for invoice line items?"}
  - {id: msg:ubb-003, channel: chan:ubb-pilot, author: person:sofia, ts: "2026-07-29T10:20:00Z", reply_to: msg:ubb-002, text: "Daily, per customer, per metric is perfect."}
  - {id: msg:ubb-004, channel: chan:ubb-pilot, author: person:rafael, ts: "2026-07-30T16:00:00Z", reply_to: msg:ubb-002, text: "Done in PR #931."}
  - {id: msg:ubb-005, channel: chan:ubb-pilot, author: person:omar, ts: "2026-08-12T11:00:00Z", text: "First cut of the usage chart in billing-portal. Maya, can you review?"}
  - {id: msg:ubb-006, channel: chan:ubb-pilot, author: person:maya, ts: "2026-08-12T11:30:00Z", reply_to: msg:ubb-005, text: "Love it. Let's show the projected invoice next to it."}
  - {id: msg:ubb-007, channel: chan:ubb-pilot, author: person:sofia, ts: "2026-08-27T13:00:00Z", text: "Usage line items are in invoicing-service behind a flag (PR #936). Rafael, can you review?"}
  - {id: msg:ubb-008, channel: chan:ubb-pilot, author: person:rafael, ts: "2026-08-27T14:10:00Z", reply_to: msg:ubb-007, text: "Reviewed, one nit about timezones."}
  - {id: msg:ubb-009, channel: chan:ubb-pilot, author: person:chloe, ts: "2026-09-10T09:00:00Z", text: "Saltmarsh is live on staging! Copperleaf next week."}
  - {id: msg:ubb-010, channel: chan:ubb-pilot, author: person:omar, ts: "2026-09-10T09:05:00Z", reply_to: msg:ubb-009, text: "Let's go!"}
  - {id: msg:ubb-011, channel: chan:ubb-pilot, author: person:rafael, ts: "2026-09-24T10:00:00Z", text: "Aggregation moved to hourly (PR #944). Omar, the chart can poll hourly now."}
  - {id: msg:ubb-012, channel: chan:ubb-pilot, author: person:omar, ts: "2026-09-24T10:40:00Z", reply_to: msg:ubb-011, text: "Updated, thanks Rafael."}
  - {id: msg:ubb-013, channel: chan:ubb-pilot, author: person:sofia, ts: "2026-10-08T15:00:00Z", text: "Heads up: invoicing reads ledger balances and nobody owns ledger-service. That's a risk for UBB GA."}
  - {id: msg:ubb-014, channel: chan:ubb-pilot, author: person:chloe, ts: "2026-10-08T15:20:00Z", reply_to: msg:ubb-013, text: "Raising it with Hannah this week."}
  - {id: msg:ubb-015, channel: chan:ubb-pilot, author: person:maya, ts: "2026-10-14T10:00:00Z", text: "Final designs for the usage view are in Figma. Omar, Chloe, Rafael, Sofia: comments by Friday please."}

