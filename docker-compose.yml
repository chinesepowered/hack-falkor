services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # FalkorDB (Redis protocol)
      - "3000:3000"   # FalkorDB Browser: inspect the graph at http://localhost:3000
    volumes:
      - falkordb-data:/var/lib/falkordb/data
  app:
    build: .
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      - "8000:8000"   # CapyBrain at http://localhost:8000
    depends_on:
      - falkordb
volumes:
  falkordb-data:
